services:
  web:
    type: web
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        sync: false
      - key: LOG_LEVEL
        sync: false
    region: eu-central
    plan: free
    dockerfilePath: ./Dockerfile
